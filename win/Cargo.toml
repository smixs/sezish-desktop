[workspace]
members = [
    "crates/sez-core",
    "crates/sez-hotkey",
    "crates/sez-audio",
    "crates/sez-asr-cloud",
    "crates/sez-asr-local",
    "crates/sez-inject",
    "crates/sez-history",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"

[workspace.dependencies]
async-trait = "0.1"
cpal = "0.17.3"
rubato = "4.0.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
