<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>sezish</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="onboarding.css" />
    <script src="shortcut.js" defer></script>
    <script src="onboarding.js" defer></script>
  </head>
  <body class="tour">
    <svg class="icon-defs" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-mic" viewBox="0 0 20 20"><rect x="7.5" y="2.5" width="5" height="9.5" rx="2.5" /><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5" /></symbol>
        <symbol id="i-cloud" viewBox="0 0 20 20"><path d="M6 15.5h8.2a3.3 3.3 0 0 0 .4-6.6 4.8 4.8 0 0 0-9.3 1A2.8 2.8 0 0 0 6 15.5z" /></symbol>
        <symbol id="i-laptop" viewBox="0 0 20 20"><rect x="4" y="4.5" width="12" height="8.5" rx="1.5" /><path d="M2.5 15.5h15" /></symbol>
        <symbol id="i-check" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8" /></symbol>
        <symbol id="i-tray" viewBox="0 0 20 20"><rect x="2.5" y="12" width="15" height="4.5" rx="1.2" /><path d="M13 14.2h2" /></symbol>
      </defs>
    </svg>

    <div id="download-pill" class="download-pill" aria-live="polite" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span data-t="downloading"></span>
      <span id="download-percent" class="pill-percent"></span>
    </div>

    <main class="tour-stage">
      <!-- 1. Microphone -->
      <section id="screen-microphone" class="screen" aria-labelledby="mic-title" hidden>
        <header class="heading">
          <h1 id="mic-title" data-t="micTitle"></h1>
          <p data-t="micSubtitle"></p>
        </header>
        <div class="card tour-card">
          <div class="row">
            <svg class="icon row-icon"><use href="#i-mic" /></svg>
            <div class="row-copy">
              <span class="row-title" data-t="microphone"></span>
              <span id="mic-hint" class="row-hint"></span>
            </div>
            <span id="mic-allowed" class="allowed-mark" hidden>
              <svg class="icon"><use href="#i-check" /></svg>
              <span data-t="allowed"></span>
            </span>
            <button id="mic-grant" class="control-button" type="button"></button>
          </div>
        </div>
      </section>

      <!-- 2. Engine -->
      <section id="screen-engine" class="screen" aria-labelledby="engine-title" hidden>
        <header class="heading">
          <h1 id="engine-title" data-t="engineTitle"></h1>
          <p data-t="engineSubtitle"></p>
        </header>
        <div class="choices" role="radiogroup" aria-labelledby="engine-title">
          <button id="choose-cloud" class="choice" type="button" role="radio">
            <svg class="icon choice-icon"><use href="#i-cloud" /></svg>
            <span class="row-copy">
              <span class="choice-title"><span data-t="cloudTitle"></span><span class="badge" data-t="recommended"></span></span>
              <span class="row-hint" data-t="cloudHint"></span>
            </span>
            <span class="radio" aria-hidden="true"></span>
          </button>
          <button id="choose-local" class="choice" type="button" role="radio">
            <svg class="icon choice-icon"><use href="#i-laptop" /></svg>
            <span class="row-copy">
              <span class="choice-title" data-t="localTitle"></span>
              <span class="row-hint" data-t="localHint"></span>
              <span id="local-status" class="choice-status"></span>
            </span>
            <span class="radio" aria-hidden="true"></span>
          </button>
        </div>
        <button id="retry" class="text-button" type="button" data-t="retry" hidden></button>
        <button id="engine-continue" class="primary-button tour-primary" type="button" data-t="continue"></button>
      </section>

      <!-- 3. Done -->
      <section id="screen-done" class="screen screen-done" aria-labelledby="done-title" hidden>
        <svg class="done-glyph" viewBox="0 0 476 631" aria-hidden="true">
          <path fill="#FF0000" d="M197.90,281.03 C197.44,277.26 197.03,275.07 197.03,272.48 L197.03,30.68 C197.03,13.75 210.78,0 227.71,0 L237.15,0 C254.08,0 267.83,13.75 267.83,30.68 L267.83,261.99 C267.91,262.55 267.93,271.17 270.67,274.18 C276.77,280.88 291.49,291.81 304.42,302.23 L306.13,303.15 C334.18,322.47 363.38,348.06 372.28,371.48 C375.15,379.04 377.48,393.03 377.49,395.68 C377.51,395.96 377.49,511.55 377.49,511.55 C377.49,528.48 363.74,542.23 346.81,542.23 L337.37,542.23 C320.43,542.23 306.69,528.48 306.69,511.55 C306.69,511.55 307.14,403.35 306.95,402.81 C301.65,387.97 288.66,378.10 277.15,369.80 C262.95,359.56 223.35,330.46 214.74,319.71 C207.64,310.86 200.11,299.14 197.90,281.03 Z"></path>
          <rect x="0.00" y="234.79" width="70.80" height="161.16" rx="30.68" fill="#FFA700"></rect>
          <rect x="99.31" y="150.46" width="70.80" height="303.16" rx="30.68" fill="#FF6B00"></rect>
          <rect x="197.42" y="400.35" width="70.80" height="230.36" rx="30.68" fill="#FF3600"></rect>
          <rect x="305.95" y="94.66" width="70.80" height="161.16" rx="30.68" fill="#FF0044"></rect>
          <rect x="404.65" y="221.46" width="70.80" height="161.16" rx="30.68" fill="#FF0087"></rect>
        </svg>
        <h1 id="done-title" data-t="doneTitle"></h1>
        <p id="key-line" class="key-line"></p>
        <span class="tray-pill">
          <svg class="icon"><use href="#i-tray" /></svg>
          <span data-t="livesInTray"></span>
        </span>
        <button id="start" class="primary-button tour-primary" type="button"></button>
      </section>
    </main>

    <footer class="tour-bar">
      <div class="segmented" role="radiogroup" aria-label="Язык / Til">
        <button class="segment" type="button" role="radio" data-language="uz">Oʼzbekcha</button>
        <button class="segment" type="button" role="radio" data-language="ru">Русский</button>
      </div>
      <button id="back" class="back-text" type="button" data-t="back" hidden></button>
    </footer>
  </body>
</html>
