<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>sezish</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div id="preview-banner" class="preview-banner" hidden>
      <span id="preview-message"></span>
      <button id="dismiss-preview" class="banner-dismiss" type="button" aria-label="Закрыть">×</button>
    </div>

    <header class="app-header">
      <div class="brand-lockup" aria-label="sezish">
        <svg class="brand-glyph" viewBox="0 0 476 631" role="img" aria-hidden="true">
          <path
            fill="#FF0000"
            d="M197.90,281.03 C197.44,277.26 197.03,275.07 197.03,272.48 L197.03,30.68 C197.03,13.75 210.78,0 227.71,0 L237.15,0 C254.08,0 267.83,13.75 267.83,30.68 L267.83,261.99 C267.91,262.55 267.93,271.17 270.67,274.18 C276.77,280.88 291.49,291.81 304.42,302.23 L306.13,303.15 C334.18,322.47 363.38,348.06 372.28,371.48 C375.15,379.04 377.48,393.03 377.49,395.68 C377.51,395.96 377.49,511.55 377.49,511.55 C377.49,528.48 363.74,542.23 346.81,542.23 L337.37,542.23 C320.43,542.23 306.69,528.48 306.69,511.55 C306.69,511.55 307.14,403.35 306.95,402.81 C301.65,387.97 288.66,378.10 277.15,369.80 C262.95,359.56 223.35,330.46 214.74,319.71 C207.64,310.86 200.11,299.14 197.90,281.03 Z"
          ></path>
          <rect x="0.00" y="234.79" width="70.80" height="161.16" rx="30.68" ry="30.68" fill="#FFA700"></rect>
          <rect x="99.31" y="150.46" width="70.80" height="303.16" rx="30.68" ry="30.68" fill="#FF6B00"></rect>
          <rect x="197.42" y="400.35" width="70.80" height="230.36" rx="30.68" ry="30.68" fill="#FF3600"></rect>
          <rect x="305.95" y="94.66" width="70.80" height="161.16" rx="30.68" ry="30.68" fill="#FF0044"></rect>
          <rect x="404.65" y="221.46" width="70.80" height="161.16" rx="30.68" ry="30.68" fill="#FF0087"></rect>
        </svg>
        <span class="brand-name">sezish</span>
      </div>
      <h1 id="page-title"></h1>
    </header>

    <main class="page-shell">
      <section class="settings-grid" aria-labelledby="page-title">
        <article class="card">
          <h2 id="general-heading"></h2>
          <p id="general-error" class="inline-error" hidden></p>

          <div class="control-block">
            <div class="control-copy">
              <span id="language-label" class="control-label"></span>
            </div>
            <div class="segmented-control" role="radiogroup" aria-labelledby="language-label">
              <button id="language-uz" class="segment" type="button" role="radio">Oʼzbekcha</button>
              <button id="language-ru" class="segment" type="button" role="radio">Русский</button>
            </div>
          </div>
          <p id="language-error" class="inline-error" hidden></p>

          <label class="toggle-row" for="autostart-toggle">
            <span id="autostart-label" class="control-label"></span>
            <span class="switch">
              <input id="autostart-toggle" type="checkbox" />
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>
          <p id="autostart-error" class="inline-error" hidden></p>

          <label class="toggle-row" for="sounds-toggle">
            <span id="sounds-label" class="control-label"></span>
            <span class="switch">
              <input id="sounds-toggle" type="checkbox" />
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>
          <p id="sounds-error" class="inline-error" hidden></p>
        </article>

        <article class="card">
          <h2 id="hotkey-heading"></h2>
          <p id="hotkey-section-label" class="section-intro"></p>
          <label class="toggle-row" for="hotkey-toggle">
            <span id="hotkey-toggle-label" class="control-label"></span>
            <span class="switch">
              <input id="hotkey-toggle" type="checkbox" />
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>
          <p id="hotkey-hint" class="hint"></p>
          <div class="control-block">
            <span id="shortcut-label" class="control-label"></span>
            <button id="shortcut-recorder" class="secondary-button shortcut-recorder" type="button">
              <span id="shortcut-value"></span>
            </button>
          </div>
          <p id="shortcut-warning" class="option-warning" aria-live="polite" hidden></p>
          <p id="hotkey-error" class="inline-error" hidden></p>
        </article>

        <article class="card card-wide">
          <h2 id="recognition-heading"></h2>
          <div class="option-grid" role="radiogroup" aria-labelledby="recognition-heading">
            <button id="mode-cloud" class="option-card" type="button" role="radio">
              <span class="radio-dot" aria-hidden="true"></span>
              <span class="option-copy">
                <span id="cloud-title" class="option-title"></span>
                <span id="cloud-subtitle" class="option-subtitle"></span>
                <span id="cloud-unavailable" class="option-warning" hidden></span>
              </span>
            </button>
            <button id="mode-local" class="option-card" type="button" role="radio">
              <span class="radio-dot" aria-hidden="true"></span>
              <span class="option-copy">
                <span id="local-title" class="option-title"></span>
                <span id="local-subtitle" class="option-subtitle"></span>
              </span>
            </button>
          </div>
          <p id="recognition-error" class="inline-error" hidden></p>

          <div id="model-section" class="model-section">
            <p id="model-section-label" class="section-intro"></p>
            <div class="option-grid" role="radiogroup" aria-labelledby="model-section-label">
              <button id="model-multilingual" class="option-card" type="button" role="radio">
                <span class="radio-dot" aria-hidden="true"></span>
                <span class="option-copy">
                  <span id="model-multilingual-title" class="option-title"></span>
                  <span id="model-multilingual-subtitle" class="option-subtitle"></span>
                </span>
              </button>
              <button id="model-ru-en-punctuated" class="option-card" type="button" role="radio">
                <span class="radio-dot" aria-hidden="true"></span>
                <span class="option-copy">
                  <span id="model-ru-en-punctuated-title" class="option-title"></span>
                  <span id="model-ru-en-punctuated-subtitle" class="option-subtitle"></span>
                </span>
              </button>
            </div>
            <div id="model-status" class="model-status"></div>
            <p id="model-error" class="inline-error" hidden></p>
          </div>
        </article>
      </section>

      <section class="lower-grid">
        <article class="card">
          <div class="section-header">
            <h2 id="history-heading"></h2>
            <button id="open-folder" class="secondary-button" type="button"></button>
          </div>
          <div id="history-list" class="history-list"></div>
          <p id="history-error" class="inline-error" hidden></p>
        </article>

        <article class="card">
          <h2 id="updates-heading"></h2>
          <div class="version-row">
            <span id="version-label" class="control-label"></span>
            <span id="version-value" class="version-value">—</span>
          </div>
          <button id="check-updates" class="secondary-button full-width" type="button"></button>
          <p id="updates-status" class="status-note" aria-live="polite"></p>
          <p id="updates-error" class="inline-error" hidden></p>
        </article>
      </section>
    </main>
  </body>
</html>
