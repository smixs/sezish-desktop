<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>sezish</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="shortcut.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <svg class="icon-defs" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-gear" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6" /><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" /></symbol>
        <symbol id="i-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" /><path d="M10 6v4.2l2.8 1.8" /></symbol>
        <symbol id="i-keyboard" viewBox="0 0 20 20"><rect x="2.5" y="5" width="15" height="10" rx="2" /><path d="M5.5 8h1M9.5 8h1M13.5 8h1M5.5 11.5h1M7.5 11.5h5M13.5 11.5h1" /></symbol>
        <symbol id="i-hand" viewBox="0 0 20 20"><path d="M7 10V4.8a1.2 1.2 0 0 1 2.4 0V9M9.4 9V3.7a1.2 1.2 0 0 1 2.4 0V9M11.8 9V4.6a1.2 1.2 0 0 1 2.4 0V11c0 3.3-2.2 6-5.2 6-2.1 0-3.4-1-4.4-2.7l-1.6-2.9a1.2 1.2 0 0 1 2-1.3L7 12" /></symbol>
        <symbol id="i-waveform" viewBox="0 0 20 20"><path d="M3 10h1.5M6.5 6.5v7M10 3.5v13M13.5 6.5v7M16.5 10H17" /></symbol>
        <symbol id="i-wave" viewBox="0 0 20 20"><path d="M2.5 10c1.6 0 1.9-4.5 3.7-4.5S8.3 14.5 10 14.5s1.9-9 3.8-9 2.1 4.5 3.7 4.5" /></symbol>
        <symbol id="i-panel" viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="2" /><path d="M7 12.5h6" /></symbol>
        <symbol id="i-speaker" viewBox="0 0 20 20"><path d="M3.5 8v4h3l4 3.5v-11l-4 3.5z" /><path d="M13.5 7.5a3.5 3.5 0 0 1 0 5M15.5 5.5a6.2 6.2 0 0 1 0 9" /></symbol>
        <symbol id="i-power" viewBox="0 0 20 20"><path d="M10 3v6.5" /><path d="M6.2 5.6a6 6 0 1 0 7.6 0" /></symbol>
        <symbol id="i-globe" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" /><path d="M3 10h14M10 3c2 2 2.8 4.4 2.8 7S12 15 10 17c-2-2-2.8-4.4-2.8-7S8 5 10 3z" /></symbol>
        <symbol id="i-key" viewBox="0 0 20 20"><circle cx="7" cy="12.5" r="3.5" /><path d="M9.5 10l6.5-6.5M13.5 6l2 2" /></symbol>
        <symbol id="i-sparkle" viewBox="0 0 20 20"><path d="M10 3l1.6 4.4L16 9l-4.4 1.6L10 15l-1.6-4.4L4 9l4.4-1.6z" /></symbol>
        <symbol id="i-chevron-right" viewBox="0 0 20 20"><path d="M8 5l5 5-5 5" /></symbol>
        <symbol id="i-chevron-left" viewBox="0 0 20 20"><path d="M12 5l-5 5 5 5" /></symbol>
        <symbol id="i-search" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5" /><path d="M12.7 12.7l3.8 3.8" /></symbol>
        <symbol id="i-copy" viewBox="0 0 20 20"><rect x="7" y="7" width="9" height="9" rx="1.8" /><path d="M13 7V5.3A1.8 1.8 0 0 0 11.2 3.5H5.3A1.8 1.8 0 0 0 3.5 5.3v5.9A1.8 1.8 0 0 0 5.3 13H7" /></symbol>
        <symbol id="i-check" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8" /></symbol>
        <symbol id="i-folder" viewBox="0 0 20 20"><path d="M2.5 6.2A1.7 1.7 0 0 1 4.2 4.5h3.2l1.8 2h6.6a1.7 1.7 0 0 1 1.7 1.7v6.1a1.7 1.7 0 0 1-1.7 1.7H4.2a1.7 1.7 0 0 1-1.7-1.7z" /></symbol>
        <symbol id="i-external" viewBox="0 0 20 20"><path d="M11 4h5v5M16 4l-7 7M14 12v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h3" /></symbol>
      </defs>
    </svg>

    <div id="preview-banner" class="preview-banner" hidden>
      <span data-t="previewMode"></span>
      <button id="dismiss-preview" class="banner-dismiss" type="button" data-t-label="dismiss">×</button>
    </div>

    <div class="shell">
      <nav class="sidebar" aria-label="sezish">
        <div class="brand-lockup">
          <svg class="brand-glyph" viewBox="0 0 476 631" aria-hidden="true">
            <path
              fill="#FF0000"
              d="M197.90,281.03 C197.44,277.26 197.03,275.07 197.03,272.48 L197.03,30.68 C197.03,13.75 210.78,0 227.71,0 L237.15,0 C254.08,0 267.83,13.75 267.83,30.68 L267.83,261.99 C267.91,262.55 267.93,271.17 270.67,274.18 C276.77,280.88 291.49,291.81 304.42,302.23 L306.13,303.15 C334.18,322.47 363.38,348.06 372.28,371.48 C375.15,379.04 377.48,393.03 377.49,395.68 C377.51,395.96 377.49,511.55 377.49,511.55 C377.49,528.48 363.74,542.23 346.81,542.23 L337.37,542.23 C320.43,542.23 306.69,528.48 306.69,511.55 C306.69,511.55 307.14,403.35 306.95,402.81 C301.65,387.97 288.66,378.10 277.15,369.80 C262.95,359.56 223.35,330.46 214.74,319.71 C207.64,310.86 200.11,299.14 197.90,281.03 Z"
            ></path>
            <rect x="0.00" y="234.79" width="70.80" height="161.16" rx="30.68" ry="30.68" fill="#FFA700"></rect>
            <rect x="99.31" y="150.46" width="70.80" height="303.16" rx="30.68" ry="30.68" fill="#FF6B00"></rect>
            <rect x="197.42" y="400.35" width="70.80" height="230.36" rx="30.68" ry="30.68" fill="#FF3600"></rect>
            <rect x="305.95" y="94.66" width="70.80" height="161.16" rx="30.68" ry="30.68" fill="#FF0044"></rect>
            <rect x="404.65" y="221.46" width="70.80" height="161.16" rx="30.68" ry="30.68" fill="#FF0087"></rect>
          </svg>
          <span class="brand-name">sezish</span>
        </div>

        <ul class="nav-list">
          <li>
            <button class="nav-item" type="button" data-pane="general">
              <span class="pane-tile tile-general"><svg class="icon"><use href="#i-gear" /></svg></span>
              <span data-t="general"></span>
            </button>
          </li>
          <li>
            <button class="nav-item" type="button" data-pane="history">
              <span class="pane-tile tile-history"><svg class="icon"><use href="#i-clock" /></svg></span>
              <span data-t="paneHistory"></span>
            </button>
          </li>
        </ul>

        <div class="sidebar-footer">
          <button id="quit" class="footer-link footer-quit" type="button" data-t="quit"></button>
          <span class="footer-version"><span data-t="version"></span> <span id="version-value">—</span></span>
          <button id="check-updates" class="footer-link" type="button" data-t="checkUpdates"></button>
          <p id="updates-status" class="footer-status" aria-live="polite"></p>
        </div>
      </nav>

      <main class="detail">
        <!-- General -->
        <section id="pane-general" class="pane" aria-labelledby="general-title">
          <h1 id="general-title" class="pane-title" data-t="general"></h1>
          <p class="inline-error" data-error="general" hidden></p>

          <div class="card">
            <div class="row">
              <svg class="icon row-icon"><use href="#i-keyboard" /></svg>
              <div class="row-copy">
                <span class="row-title" data-t="shortcutLabel"></span>
                <span id="shortcut-warning" class="row-hint is-warning" hidden></span>
              </div>
              <button id="shortcut-recorder" class="control-button shortcut-recorder" type="button">
                <span id="shortcut-value"></span>
              </button>
            </div>

            <div class="row">
              <svg class="icon row-icon"><use href="#i-hand" /></svg>
              <div class="row-copy">
                <span id="hotkey-mode-label" class="row-title" data-t="shortcutMode"></span>
                <span id="hotkey-hint" class="row-hint"></span>
              </div>
              <div class="segmented" role="radiogroup" aria-labelledby="hotkey-mode-label">
                <button class="segment" type="button" role="radio" data-hotkey-mode="hold" data-t="modeHold"></button>
                <button class="segment" type="button" role="radio" data-hotkey-mode="toggle" data-t="modeToggle"></button>
              </div>
            </div>

            <button id="open-recognition" class="row row-link" type="button">
              <svg class="icon row-icon"><use href="#i-waveform" /></svg>
              <div class="row-copy">
                <span class="row-title" data-t="recognition"></span>
              </div>
              <span id="engine-name" class="row-value"></span>
              <svg class="icon row-chevron"><use href="#i-chevron-right" /></svg>
            </button>

            <div class="row">
              <svg class="icon row-icon"><use href="#i-wave" /></svg>
              <div class="row-copy">
                <span id="wave-label" class="row-title" data-t="waveIntensity"></span>
              </div>
              <div class="segmented" role="radiogroup" aria-labelledby="wave-label">
                <button class="segment" type="button" role="radio" data-wave="calm" data-t="waveCalm"></button>
                <button class="segment" type="button" role="radio" data-wave="lively" data-t="waveLively"></button>
                <button class="segment" type="button" role="radio" data-wave="bold" data-t="waveBold"></button>
              </div>
            </div>

            <div class="row">
              <svg class="icon row-icon"><use href="#i-panel" /></svg>
              <div class="row-copy">
                <span id="placement-label" class="row-title" data-t="hudPlacement"></span>
              </div>
              <div class="segmented" role="radiogroup" aria-labelledby="placement-label">
                <button class="segment" type="button" role="radio" data-placement="bottom" data-t="hudBottom"></button>
                <button class="segment" type="button" role="radio" data-placement="top" data-t="hudTop"></button>
              </div>
            </div>

            <div class="row">
              <svg class="icon row-icon"><use href="#i-speaker" /></svg>
              <div class="row-copy">
                <span id="sounds-label" class="row-title" data-t="soundsToggle"></span>
              </div>
              <div class="row-controls">
                <input id="sound-volume" class="slider" type="range" min="0" max="100" step="1" data-t-label="soundVolume" />
                <label class="switch">
                  <input id="sounds-toggle" type="checkbox" role="switch" aria-labelledby="sounds-label" />
                  <span class="switch-track" aria-hidden="true"></span>
                </label>
              </div>
            </div>

            <div class="row">
              <svg class="icon row-icon"><use href="#i-power" /></svg>
              <div class="row-copy">
                <span id="autostart-label" class="row-title" data-t="launchAtLogin"></span>
              </div>
              <label class="switch">
                <input id="autostart-toggle" type="checkbox" role="switch" aria-labelledby="autostart-label" />
                <span class="switch-track" aria-hidden="true"></span>
              </label>
            </div>
          </div>
          <p class="inline-error" data-error="controls" hidden></p>

          <button id="advanced-toggle" class="disclosure" type="button" aria-expanded="false" aria-controls="advanced-card">
            <span data-t="advanced"></span>
            <svg class="icon disclosure-chevron"><use href="#i-chevron-right" /></svg>
          </button>

          <div id="advanced-card" class="card" hidden>
            <div class="row">
              <svg class="icon row-icon"><use href="#i-globe" /></svg>
              <div class="row-copy">
                <span id="language-label" class="row-title" data-t="language"></span>
              </div>
              <div class="segmented" role="radiogroup" aria-labelledby="language-label">
                <button class="segment" type="button" role="radio" data-language="uz">Oʼzbekcha</button>
                <button class="segment" type="button" role="radio" data-language="ru">Русский</button>
              </div>
            </div>
            <button id="run-onboarding" class="row row-link" type="button">
              <svg class="icon row-icon"><use href="#i-sparkle" /></svg>
              <span class="row-copy"><span class="row-title" data-t="runAgain"></span></span>
              <svg class="icon row-chevron"><use href="#i-chevron-right" /></svg>
            </button>
          </div>
        </section>

        <!-- Recognition (opens from General) -->
        <section id="pane-recognition" class="pane" aria-labelledby="recognition-title" hidden>
          <button id="back-to-general" class="back-link" type="button">
            <svg class="icon"><use href="#i-chevron-left" /></svg>
            <span data-t="general"></span>
          </button>
          <h1 id="recognition-title" class="pane-title" data-t="recognition"></h1>

          <div class="card" role="radiogroup" aria-labelledby="recognition-title">
            <button class="row option" type="button" role="radio" data-mode="cloud">
              <span class="radio" aria-hidden="true"></span>
              <span class="row-copy">
                <span class="row-title" data-t="cloudTitle"></span>
                <span class="row-hint" data-t="cloudSubtitle"></span>
              </span>
            </button>
            <button class="row option" type="button" role="radio" data-mode="local">
              <span class="radio" aria-hidden="true"></span>
              <span class="row-copy">
                <span class="row-title" data-t="localTitle"></span>
                <span class="row-hint" data-t="localSubtitle"></span>
              </span>
            </button>
            <button class="row option" type="button" role="radio" data-mode="gemini">
              <span class="radio" aria-hidden="true"></span>
              <span class="row-copy">
                <span class="row-title" data-t="geminiTitle"></span>
                <span class="row-hint" data-t="geminiSubtitle"></span>
              </span>
            </button>
            <button class="row option" type="button" role="radio" data-mode="openai">
              <span class="radio" aria-hidden="true"></span>
              <span class="row-copy">
                <span class="row-title" data-t="openaiTitle"></span>
                <span class="row-hint" data-t="openaiSubtitle"></span>
              </span>
            </button>
          </div>
          <p id="cloud-unavailable" class="section-footer" data-t="cloudUnavailable" hidden></p>
          <p class="inline-error" data-error="recognition" hidden></p>

          <!-- Gemini -->
          <div id="gemini-section" class="section" hidden>
            <h2 class="section-label" data-t="geminiSection"></h2>
            <div class="card">
              <div class="row">
                <svg class="icon row-icon"><use href="#i-key" /></svg>
                <div class="row-copy">
                  <label class="row-title" for="gemini-key" data-t="keyLabel"></label>
                </div>
                <div class="key-field">
                  <input id="gemini-key" class="text-field" type="password" autocomplete="off" spellcheck="false" />
                  <button id="gemini-key-clear" class="text-button" type="button" data-t="deleteKey" hidden></button>
                </div>
              </div>
              <div class="row">
                <svg class="icon row-icon"><use href="#i-sparkle" /></svg>
                <div class="row-copy">
                  <span id="gemini-smart-label" class="row-title" data-t="geminiSmartTitle"></span>
                  <span class="row-hint" data-t="geminiSmartSubtitle"></span>
                </div>
                <label class="switch">
                  <input id="gemini-smart" type="checkbox" role="switch" aria-labelledby="gemini-smart-label" />
                  <span class="switch-track" aria-hidden="true"></span>
                </label>
              </div>
              <button class="row row-link" type="button" data-key-page="gemini">
                <svg class="icon row-icon"><use href="#i-external" /></svg>
                <span class="row-copy"><span class="row-title" data-t="getKey"></span></span>
              </button>
            </div>
            <p id="gemini-footer" class="section-footer"></p>
          </div>

          <!-- OpenAI -->
          <div id="openai-section" class="section" hidden>
            <h2 class="section-label" data-t="openaiTitle"></h2>
            <div class="card">
              <div class="row">
                <svg class="icon row-icon"><use href="#i-key" /></svg>
                <div class="row-copy">
                  <label class="row-title" for="openai-key" data-t="keyLabel"></label>
                </div>
                <div class="key-field">
                  <input id="openai-key" class="text-field" type="password" autocomplete="off" spellcheck="false" />
                  <button id="openai-key-clear" class="text-button" type="button" data-t="deleteKey" hidden></button>
                </div>
              </div>
              <div role="radiogroup" data-t-label="openaiTitle">
                <button class="row option" type="button" role="radio" data-openai-model="gpt-transcribe">
                  <span class="radio" aria-hidden="true"></span>
                  <span class="row-copy">
                    <span class="row-title" data-t="openaiModelTranscribe"></span>
                    <span class="row-hint" data-t="openaiModelTranscribeHint"></span>
                  </span>
                </button>
                <button class="row option" type="button" role="radio" data-openai-model="gpt-4o-mini-transcribe">
                  <span class="radio" aria-hidden="true"></span>
                  <span class="row-copy">
                    <span class="row-title" data-t="openaiModelMini"></span>
                    <span class="row-hint" data-t="openaiModelMiniHint"></span>
                  </span>
                </button>
              </div>
              <button class="row row-link" type="button" data-key-page="openai">
                <svg class="icon row-icon"><use href="#i-external" /></svg>
                <span class="row-copy"><span class="row-title" data-t="getKey"></span></span>
              </button>
            </div>
            <p id="openai-footer" class="section-footer"></p>
          </div>

          <!-- Local model -->
          <div id="model-section" class="section" hidden>
            <h2 id="model-label" class="section-label" data-t="modelSection"></h2>
            <div class="card">
              <div role="radiogroup" aria-labelledby="model-label">
                <button class="row option" type="button" role="radio" data-model="multilingual">
                  <span class="radio" aria-hidden="true"></span>
                  <span class="row-copy">
                    <span class="row-title" data-t="modelMultiTitle"></span>
                    <span class="row-hint" data-t="modelMultiSubtitle"></span>
                  </span>
                </button>
                <button class="row option" type="button" role="radio" data-model="ru-en-punctuated">
                  <span class="radio" aria-hidden="true"></span>
                  <span class="row-copy">
                    <span class="row-title" data-t="modelRuEnTitle"></span>
                    <span class="row-hint" data-t="modelRuEnSubtitle"></span>
                  </span>
                </button>
              </div>
              <div id="model-status" class="row model-status"></div>
            </div>
            <p class="section-footer" data-t="modelFooter"></p>
            <p class="inline-error" data-error="model" hidden></p>
          </div>
        </section>

        <!-- History -->
        <section id="pane-history" class="pane" aria-labelledby="history-title" hidden>
          <div class="pane-header">
            <h1 id="history-title" class="pane-title" data-t="paneHistory"></h1>
            <button id="open-folder" class="control-button" type="button">
              <svg class="icon"><use href="#i-folder" /></svg>
              <span data-t="openFolder"></span>
            </button>
          </div>
          <label class="search-field">
            <svg class="icon"><use href="#i-search" /></svg>
            <input id="history-search" type="search" autocomplete="off" spellcheck="false" />
          </label>
          <div id="history-list" class="history-list" aria-live="polite"></div>
          <p class="inline-error" data-error="history" hidden></p>
        </section>
      </main>
    </div>
  </body>
</html>
