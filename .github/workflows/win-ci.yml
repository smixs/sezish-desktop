name: Windows port CI

# Manual only: fmt/clippy/test run locally on the mac before every push.
# This job exists to catch MSVC-specific breakage before a release tag.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: win
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: win
      # ADR-0007: authored manifests and a checked-in lockfile must never enable
      # ort's download-binaries feature.
      - name: Guard against ort binary downloads
        shell: bash
        run: |
          # Match the feature only where it's actually enabled (quoted), and skip
          # win/spikes — a throwaway workspace outside CI whose comments mention it.
          if grep -R --include='Cargo.toml' --include='Cargo.lock' --exclude-dir=spikes -n '"download-binaries"' .; then
            echo "ADR-0007 forbids the ort download-binaries feature."
            exit 1
          fi
      # tauri's build script validates bundle.resources paths at compile time;
      # CI only needs the files to exist. The real DLLs are vendored by
      # win-release (pinned Microsoft build), never by ort (ADR-0007).
      - name: Stub ONNX Runtime DLL resources
        shell: bash
        run: |
          printf 'placeholder for cargo check' > src-tauri/onnxruntime.dll
          printf 'placeholder for cargo check' > src-tauri/onnxruntime_providers_shared.dll
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
